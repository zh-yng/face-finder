<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Face Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◍</span>
      <span class="brand-name">Face Finder</span>
      <span class="brand-sub">runs entirely on this machine</span>
    </div>
    <div class="actions">
      <div id="scanStatus" class="status-pill idle">idle</div>
      <button id="scanBtn" class="btn">Scan library</button>
      <button id="clusterBtn" class="btn btn-outline">Re-cluster</button>
    </div>
  </header>

  <main id="peopleView" class="view">
    <div id="peopleEmpty" class="empty-state hidden">
      <p>No people found yet.</p>
      <p class="empty-sub">Run a scan, then re-cluster, to populate this grid.</p>
    </div>
    <div id="peopleGrid" class="people-grid"></div>
  </main>

  <main id="galleryView" class="view hidden">
    <div class="gallery-header">
      <button id="backBtn" class="btn btn-outline">&larr; All people</button>
      <input id="nameInput" class="name-input" placeholder="Unnamed person" />
      <button id="saveNameBtn" class="btn">Save name</button>
      <button id="mergeModeBtn" class="btn btn-outline">Merge into…</button>
      <button id="togetherBtn" class="btn btn-outline">Find together…</button>
    </div>

    <div id="togetherPanel" class="together-panel hidden">
      <div class="together-panel-head">
        <span>Show photos with this person and…</span>
        <button id="closeTogetherPanel" class="modal-close small">&times;</button>
      </div>
      <div id="togetherList" class="together-list"></div>
      <div class="together-panel-actions">
        <button id="applyTogetherBtn" class="btn">Apply filter</button>
        <button id="clearTogetherBtn" class="btn btn-outline">Clear</button>
      </div>
    </div>
    <div id="togetherActiveBar" class="together-active-bar hidden">
      <span id="togetherActiveLabel"></span>
      <button id="clearTogetherBar" class="btn btn-outline">Clear filter</button>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>
  </main>

  <div id="photoModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="closeModal" class="modal-close">&times;</button>
      <div class="photo-wrap">
        <img id="modalImg" />
        <svg id="bboxLayer"></svg>
      </div>
      <div id="modalFaceInfo" class="modal-face-info"></div>
    </div>
  </div>

  <div id="mergeModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content merge-content">
      <button id="closeMergeModal" class="modal-close">&times;</button>
      <h3>Merge current person into…</h3>
      <p class="empty-sub">Pick the person to keep. This person's faces move into them and this card disappears.</p>
      <div id="mergeList" class="merge-list"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>

</html>
